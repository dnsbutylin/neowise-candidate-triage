<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; color: #1c1c1c; }
    textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0 1rem; padding: .5rem; font: inherit; }
    button { padding: .4rem .8rem; font: inherit; }
    button:disabled { opacity: .6; }
    #notice { min-height: 1.5em; margin: 1rem 0; }
    #notice[data-kind="error"] { padding: .75rem 1rem; background: #fff4e5; border: 1px solid #e6c48a; }
    #review { margin-top: 1.5rem; }
    #draft { white-space: pre-wrap; background: #f4f6f8; padding: 1rem; margin: 0; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <p>Вставьте текст заявки. Тема и черновик появятся ниже — перед отправкой клиенту прочитайте их сами.</p>
  <form>
    <label for="message">Текст заявки</label>
    <textarea id="message" rows="4"></textarea>
    <button type="submit">Разобрать заявку</button>
  </form>
  <p id="notice" role="status" aria-live="polite"></p>
  <section id="review" hidden>
    <h2>Разбор</h2>
    <p>Тема: <strong id="topic"></strong></p>
    <h3>Черновик ответа</h3>
    <pre id="draft"></pre>
  </section>
  <script type="module">
    const form = document.querySelector("form");
    const message = document.querySelector("#message");
    const notice = document.querySelector("#notice");
    const review = document.querySelector("#review");
    const topic = document.querySelector("#topic");
    const draft = document.querySelector("#draft");
    const submitButton = form.querySelector("button");

    const topicLabels = {
      delivery: "Доставка",
      pricing: "Стоимость",
      other: "Другое",
    };

    function clearDraft() {
      review.hidden = true;
      topic.textContent = "";
      draft.textContent = "";
    }

    function showNotice(text, kind) {
      notice.textContent = text;
      if (kind) notice.dataset.kind = kind;
      else delete notice.dataset.kind;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      clearDraft();
      submitButton.disabled = true;
      showNotice("Разбираем заявку…");
      try {
        const reply = await fetch("/api/triage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: message.value }),
        });
        const data = await reply.json();
        if (reply.status === 400 || data.status === "invalid_input") {
          clearDraft();
          showNotice("Введите непустой текст заявки.", "error");
          return;
        }
        if (data.status === "ready" && typeof data.draft === "string" && data.draft.trim() !== "") {
          topic.textContent = topicLabels[data.topic] ?? data.topic;
          draft.textContent = data.draft;
          review.hidden = false;
          showNotice("Прочитайте черновик и решите, что отправить клиенту.");
          return;
        }
        clearDraft();
        showNotice("Авторазбор не удался. Разберите заявку вручную: предыдущий черновик очищен, отправлять его нельзя.", "error");
      } catch {
        clearDraft();
        showNotice("Сервис разбора недоступен. Разберите заявку вручную: предыдущий черновик очищен.", "error");
      } finally {
        submitButton.disabled = false;
      }
    });
  </script>
</body>
</html>
